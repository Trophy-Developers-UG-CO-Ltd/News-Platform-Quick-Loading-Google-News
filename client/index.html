<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta
      name="description"
      content="MukonoTalks Uganda is your go-to source for the latest news, entertainment, and local updates in Mukono. Stay informed and connected with our comprehensive coverage of everything happening in the heart of Uganda."
    />

    <!-- PWA / Theme -->

    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MukonoTalks" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>MukonoTalks Uganda | News, Entertainment, Local Updates</title>
    <script>
      (function () {
        try {
          var key = 'mukonotalks-theme';
          var stored = window.localStorage.getItem(key);
          var isDark = stored === 'dark';
          var root = document.documentElement;

          if (isDark) {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }

          root.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
